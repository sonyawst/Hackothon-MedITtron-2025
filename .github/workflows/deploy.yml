name: Deploy HTML site to GitHub Pages

on:
  push:
    branches: [ develop ]  # Изменено с main/master на develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop  # Явно указываем ветку develop
          
      - name: Create .nojekyll file
        run: |
          # Создаем .nojekyll в правильной папке
          touch src/tumor_model/templates/.nojekyll
          
      - name: Setup Pages
        uses: actions/configure-pages@v3
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: 'src/tumor_model/templates/'  # Папка с вашим index.html
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
