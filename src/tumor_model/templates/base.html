<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Медицинский центр - Прогнозирование РМЖ{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    {% load static %}
    <link href="{% static 'tumor_model/css/styles.css' %}" rel="stylesheet">
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-bg"></div>

    <!-- Glass Morphism Navigation -->
    <nav class="navbar navbar-expand-lg glass-navbar">
        <div class="container">
            <a class="navbar-brand" href="{% url 'index' %}">
                <i class="fas fa-heartbeat"></i>MedPredict
            </a>
            
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'index' %}">
                    <i class="fas fa-home me-2"></i>Главная
                </a>
                <a class="nav-link" href="{% url 'model' %}">
                    <i class="fas fa-plus-circle me-2"></i>Новое обследование
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Glass Footer -->
    <footer class="glass-navbar mt-5">
        <div class="container text-center py-4">
            <p class="mb-0 text-muted">
                <i class="fas fa-brain me-2"></i>Система прогнозирования рака молочной железы 
                <span class="mx-2">•</span> 
                <i class="fas fa-shield-alt me-2"></i>2025 Медицинский центр
            </p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    {% block scripts %}
    {% endblock %}
</body>
</html>
