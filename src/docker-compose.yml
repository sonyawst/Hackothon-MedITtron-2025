version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hackathon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./patients_script.sql:/docker-entrypoint-initdb.d/01-patients.sql  # автоматически выполнит скрипт при первом запуске

volumes:
  postgres_data: